<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>內嵌 Google Apps Script 網頁</title>
    <style>
        /* 重置基本的邊距與內距，確保 iframe 能填滿畫面 */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden; /* 防止出現雙重捲軸 */
            background-color: #f0f2f5; /* 設定一個溫和的背景色 */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* 讓 iframe 填滿整個父元素 */
        .iframe-container {
            width: 100%;
            height: 100vh; /* 使用視窗高度確保填滿 */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none; /* 移除 iframe 預設的邊框 */
        }
    </style>
</head>
<body>

    <div class="iframe-container">
        <!-- 內嵌指定的 Google Apps Script 網址 -->
        <iframe 
            src="https://script.google.com/macros/s/AKfycbxG0vS3NgK1HpAP_vD2Bms_XLSu7rwN9p9P59jVsYi7vRxN9WopJnFsuYTynf49cAg/exec" 
            title="Google Apps Script Content"
            allowfullscreen>
        </iframe>
    </div>

</body>
</html>
