<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>臺北榮民總醫院人事室 心智圖即時編輯器</title>
    
    <!-- 引入 Tailwind CSS & D3.js (Markmap 核心依賴) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    
    <!-- 引入 CodeMirror 實現語法高亮與行號 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/markdown/markdown.min.js"></script>
    
    <style>
        /* 自訂捲軸樣式 */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1; 
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }

        /* 隱藏預設 textarea 輪廓 */
        textarea:focus {
            outline: none;
        }

        /* 確保 Markmap 連線正確顯示 */
        .markmap-link {
            fill: none;
        }

        /* 讓節點圓圈更明顯 */
        svg#mindmap .markmap-node circle {
            cursor: pointer;
            transition: r 0.2s ease;
        }
        svg#mindmap .markmap-node circle:hover {
            r: 6px; 
        }

        /* 調整桿的觸控優化 */
        #resizer {
            touch-action: none;
        }

        /* CodeMirror 編輯器樣式覆寫，使其融入 Tailwind 介面 */
        .CodeMirror {
            height: 100% !important;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            font-size: 1rem;
            line-height: 1.6;
            color: #374151;
            background-color: transparent;
        }
        .CodeMirror-gutters {
            border-right: 1px solid #e5e7eb;
            background-color: #f8fafc;
            padding-right: 4px;
        }
        .CodeMirror-linenumber {
            color: #94a3b8;
        }
        @media (max-width: 768px) {
            .CodeMirror { font-size: 0.875rem; }
        }
    </style>
</head>
<body class="bg-gray-50 h-screen flex flex-col font-sans text-gray-800 transition-colors duration-300 overflow-hidden">

    <!-- 頂部導覽列 (整合設定按鈕與響應式排版) -->
    <header class="bg-blue-800 text-white p-3 md:p-4 shadow-md flex flex-wrap justify-between items-center z-10 transition-colors duration-300 flex-shrink-0 gap-3">
        
        <!-- 左側：標題區塊與側邊欄切換 -->
        <div class="flex items-center gap-2">
            <svg class="w-6 h-6 md:w-7 md:h-7 text-white hidden sm:block" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path>
            </svg>
            <h1 class="flex flex-col gap-0.5 text-base md:text-xl lg:text-2xl font-bold tracking-wide">
                <span>臺北榮民總醫院人事室</span>
                <span class="flex items-baseline gap-2">
                    心智圖即時編輯器
                    <span class="text-[10px] md:text-xs lg:text-sm font-normal text-white/75">by Leno Tsai</span>
                </span>
            </h1>
        </div>

        <!-- 中央：UI 設定控制面板 -->
        <div class="flex items-center gap-2 md:gap-3 bg-white/10 p-1.5 md:p-2 rounded-xl backdrop-blur-sm border border-white/20">
            <!-- 收合/展開編輯區按鈕 -->
            <button id="btn-toggle-editor" class="bg-white/10 hover:bg-white/20 text-white p-1.5 rounded-lg transition-all duration-300 flex items-center justify-center border border-white/20" title="收合/展開編輯區">
                <svg class="w-5 h-5 md:w-6 md:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h12a2 2 0 012 2v12a2 2 0 01-2 2H6a2 2 0 01-2-2V6z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 4v16"></path>
                </svg>
            </button>

            <div class="w-px h-6 bg-white/30 hidden sm:block"></div>

            <!-- 展開層級控制 -->
            <div class="flex items-center gap-1 md:gap-2">
                <label for="sel-expand" class="text-xs md:text-sm font-medium px-1 whitespace-nowrap">展開</label>
                <select id="sel-expand" class="bg-white text-gray-800 text-xs md:text-sm rounded-lg px-2 py-1.5 md:px-3 md:py-2 outline-none cursor-pointer focus:ring-2 focus:ring-blue-400 font-medium shadow-sm transition-all">
                    <option value="-1">依文本設定</option>
                    <option value="1">第 1 層</option>
                    <option value="2">第 2 層</option>
                    <option value="3">第 3 層</option>
                    <option value="4">第 4 層</option>
                    <option value="5">第 5 層</option>
                    <option value="999">全部展開</option>
                </select>
            </div>
            
            <div class="w-px h-6 bg-white/30 hidden sm:block"></div>
            
            <!-- 色彩鎖定控制 -->
            <div class="flex items-center gap-1 md:gap-2">
                <label for="sel-color" class="text-xs md:text-sm font-medium px-1 whitespace-nowrap">色彩</label>
                <select id="sel-color" class="bg-white text-gray-800 text-xs md:text-sm rounded-lg px-2 py-1.5 md:px-3 md:py-2 outline-none cursor-pointer focus:ring-2 focus:ring-blue-400 font-medium shadow-sm transition-all">
                    <option value="-1">依文本設定</option>
                    <option value="0">不凍結</option>
                    <option value="1">第 1 層</option>
                    <option value="2">第 2 層</option>
                    <option value="3">第 3 層</option>
                    <option value="4">第 4 層</option>
                    <option value="5">第 5 層</option>
                </select>
            </div>
        </div>

        <!-- 右側：功能按鈕區塊 -->
        <div class="flex items-center justify-end gap-2 md:gap-3 flex-grow sm:flex-grow-0">
            <button id="btn-download-md" class="bg-teal-600 hover:bg-teal-500 text-white px-3 py-2 md:px-4 md:py-2.5 rounded-xl text-xs md:text-sm transition-colors shadow-sm flex items-center gap-1 md:gap-1.5 font-medium" title="匯出 Markdown 原始檔">
                <svg class="w-4 h-4 md:w-5 md:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                <span class="hidden lg:inline">下載 MD</span>
            </button>

            <button id="btn-download-svg" class="bg-blue-600 hover:bg-blue-500 text-white px-3 py-2 md:px-4 md:py-2.5 rounded-xl text-xs md:text-sm transition-colors shadow-sm flex items-center gap-1 md:gap-1.5 font-medium" title="匯出當前視角的 SVG 圖片">
                <svg class="w-4 h-4 md:w-5 md:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                <span class="hidden lg:inline">下載 SVG</span>
            </button>

            <button id="btn-download" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-2 md:px-4 md:py-2.5 rounded-xl text-xs md:text-sm transition-colors shadow-sm flex items-center gap-1 md:gap-1.5 font-medium" title="匯出為單獨的 HTML 檔案">
                <svg class="w-4 h-4 md:w-5 md:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                <span class="hidden lg:inline">下載 HTML</span>
            </button>
            
            <button id="btn-fit" class="bg-sky-600 hover:bg-sky-500 text-white px-3 py-2 md:px-4 md:py-2.5 rounded-xl text-xs md:text-sm transition-colors shadow-sm flex items-center gap-1 md:gap-1.5 font-medium" title="將心智圖縮放至畫面中間，或恢復原視角">
                <svg class="w-4 h-4 md:w-5 md:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path></svg>
                <span id="fit-text" class="hidden lg:inline">適應螢幕</span>
            </button>
        </div>
    </header>

    <!-- 主要內容區 -->
    <main id="main-container" class="flex-1 flex flex-col md:flex-row overflow-hidden relative">
        
        <!-- 左側編輯區 -->
        <section id="editor-pane" class="w-full h-1/2 md:w-2/5 md:h-full bg-white flex flex-col shadow-inner transition-colors duration-300 flex-shrink-0">
            <div class="bg-gray-100 px-4 py-3 text-sm md:text-base font-semibold text-gray-500 border-b border-gray-200 flex justify-between items-center transition-colors duration-300">
                <div class="flex items-center gap-2">
                    <span>Markdown 編輯區</span>
                    <span id="save-status" class="text-xs text-emerald-600 font-normal opacity-0 transition-opacity duration-300">已自動儲存</span>
                </div>
                <div class="flex items-center gap-2 md:gap-3">
                    <span class="hidden lg:inline text-xs font-normal mr-1">支援 HTML & 數學公式</span>
                    
                    <!-- 編輯區字體縮放按鈕群組 -->
                    <div class="flex items-center bg-white border border-gray-300 rounded-md shadow-sm">
                        <button id="btn-text-zoom-out" class="px-2 py-1.5 text-gray-600 hover:bg-gray-100 hover:text-gray-900 rounded-l-md transition-colors font-bold text-xs border-r border-gray-300" title="縮小編輯區字體">A-</button>
                        <button id="btn-text-zoom-in" class="px-2 py-1.5 text-gray-600 hover:bg-gray-100 hover:text-gray-900 rounded-r-md transition-colors font-bold text-xs" title="放大編輯區字體">A+</button>
                    </div>

                    <input type="file" id="file-import" accept=".md,.txt" class="hidden">
                    <button id="btn-import-file" class="text-xs bg-indigo-500 hover:bg-indigo-600 text-white px-2 py-1.5 rounded-md transition-colors shadow-sm flex items-center gap-1" title="匯入 Markdown 或 TXT 檔案">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                        <span class="hidden xl:inline">匯入檔案</span>
                    </button>
                    
                    <button id="btn-clear-editor" class="text-xs bg-red-500 hover:bg-red-600 text-white px-2 py-1.5 rounded-md transition-colors shadow-sm flex items-center gap-1" title="清除所有內容">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                        <span class="hidden xl:inline">清除內容</span>
                    </button>
                </div>
            </div>
            <!-- 由 CodeMirror 接管 -->
            <div class="flex-1 w-full h-full relative">
                <textarea id="editor" class="hidden"></textarea>
            </div>
        </section>

        <!-- 拖曳調整桿 (Resizer) -->
        <div id="resizer" class="w-full h-3 md:w-3 md:h-full bg-gray-300 hover:bg-blue-400 active:bg-blue-500 flex items-center justify-center cursor-row-resize md:cursor-col-resize z-20 flex-shrink-0 transition-colors shadow-sm">
            <div class="flex md:flex-col gap-1">
                <div class="w-1 h-1 bg-gray-500 rounded-full"></div>
                <div class="w-1 h-1 bg-gray-500 rounded-full"></div>
                <div class="w-1 h-1 bg-gray-500 rounded-full"></div>
            </div>
        </div>

        <!-- 右側心智圖顯示區 -->
        <section class="flex-1 relative bg-white transition-colors duration-300 overflow-hidden">
            <svg id="mindmap" class="w-full h-full cursor-grab active:cursor-grabbing"></svg>
            
            <!-- 浮動縮放控制列 -->
            <div class="absolute bottom-6 right-6 flex items-center gap-2 bg-white/80 p-1.5 rounded-2xl shadow-sm border border-slate-200 backdrop-blur-md z-10">
                <div class="w-px h-5 bg-slate-300 ml-1 mr-0.5"></div>
                <button id="btn-zoom-in" class="flex items-center gap-1 px-3 py-1.5 bg-white border border-slate-300 hover:bg-slate-50 text-slate-800 rounded-full text-sm font-medium transition-all shadow-sm" title="放大">
                    🔍 放大
                </button>
                <button id="btn-zoom-out" class="flex items-center gap-1 px-3 py-1.5 bg-white border border-slate-300 hover:bg-slate-50 text-slate-800 rounded-full text-sm font-medium transition-all shadow-sm" title="縮小">
                    🔍 縮小
                </button>
            </div>
        </section>
    </main>

    <!-- 自訂模態框 (Modal) -->
    <div id="custom-modal" class="fixed inset-0 bg-black/40 hidden items-center justify-center z-[100] opacity-0 transition-opacity duration-300 backdrop-blur-sm">
        <div class="bg-white rounded-2xl shadow-2xl p-6 max-w-sm w-full mx-4 transform scale-95 transition-transform duration-300">
            <h3 id="modal-title" class="text-xl font-bold text-gray-800 mb-2">提示</h3>
            <p id="modal-message" class="text-gray-600 mb-6 leading-relaxed">訊息內容</p>
            <div class="flex justify-end gap-3">
                <button id="modal-cancel" class="px-4 py-2 text-gray-600 bg-gray-100 hover:bg-gray-200 rounded-xl transition-colors font-medium">取消</button>
                <button id="modal-confirm" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-xl transition-colors font-medium">確定</button>
            </div>
        </div>
    </div>
    
    <script type="module">
        import * as markmapLib from 'https://cdn.jsdelivr.net/npm/markmap-lib@0.18.9/+esm';
        import * as markmapView from 'https://cdn.jsdelivr.net/npm/markmap-view@0.18.9/+esm';
        import * as markmapCommon from 'https://cdn.jsdelivr.net/npm/markmap-common@0.18.9/+esm';

        // 將方法合併到全域變數
        window.markmap = {
            ...markmapCommon,
            ...markmapView,
            ...markmapLib
        };

        const { Transformer, Markmap, loadCSS, loadJS, deriveOptions } = window.markmap;
        const transformer = new Transformer();

        let mm;
        let currentRoot = null;
        let currentOptionsStr = '';

        const selExpand = document.getElementById('sel-expand');
        const selColor = document.getElementById('sel-color');
        const btnToggleEditor = document.getElementById('btn-toggle-editor');
        const editorPane = document.getElementById('editor-pane');
        const resizer = document.getElementById('resizer');
        const editor = document.getElementById('editor');
        const svgEl = document.getElementById('mindmap');
        const btnFit = document.getElementById('btn-fit');
        const btnZoomIn = document.getElementById('btn-zoom-in');
        const btnZoomOut = document.getElementById('btn-zoom-out');
        const fitText = document.getElementById('fit-text');
        const btnDownload = document.getElementById('btn-download');
        const btnDownloadSvg = document.getElementById('btn-download-svg');
        const btnDownloadMd = document.getElementById('btn-download-md');
        const saveStatus = document.getElementById('save-status');
        const btnClearEditor = document.getElementById('btn-clear-editor');
        const btnImportFile = document.getElementById('btn-import-file');
        const fileImport = document.getElementById('file-import');
        const btnTextZoomIn = document.getElementById('btn-text-zoom-in');
        const btnTextZoomOut = document.getElementById('btn-text-zoom-out');

        let isFitted = false;
        let prevTransform = null;
        let isEditorVisible = true;

        // --- 初始化 CodeMirror 編輯器 ---
        const cmEditor = CodeMirror.fromTextArea(editor, {
            lineNumbers: true,
            mode: 'markdown',
            lineWrapping: true,
            tabSize: 2,
            extraKeys: {
                "Tab": (cm) => {
                    if (cm.somethingSelected()) cm.indentSelection("add");
                    else cm.replaceSelection("  ", "end", "+input");
                }
            }
        });

        // --- 編輯區字體縮放邏輯 ---
        let editorFontSize = window.innerWidth >= 768 ? 16 : 14; // 預設字體大小(px)
        
        const updateEditorFontSize = () => {
            const wrapper = cmEditor.getWrapperElement();
            wrapper.style.fontSize = `${editorFontSize}px`;
            cmEditor.refresh(); // 讓 CodeMirror 重新計算行號與游標位置
        };

        btnTextZoomIn.addEventListener('click', () => {
            editorFontSize = Math.min(36, editorFontSize + 2); // 最大限制到 36px
            updateEditorFontSize();
        });

        btnTextZoomOut.addEventListener('click', () => {
            editorFontSize = Math.max(10, editorFontSize - 2); // 最小限制到 10px
            updateEditorFontSize();
        });

        // --- 收合/展開編輯區邏輯 ---
        btnToggleEditor.addEventListener('click', () => {
            isEditorVisible = !isEditorVisible;
            editorPane.style.display = isEditorVisible ? '' : 'none';
            resizer.style.display = isEditorVisible ? '' : 'none';

            if (isEditorVisible) {
                btnToggleEditor.classList.replace('bg-white/30', 'bg-white/10');
            } else {
                btnToggleEditor.classList.replace('bg-white/10', 'bg-white/30');
            }

            if (mm) {
                setTimeout(() => mm.fit(), 50);
            }
        });

        // --- 自訂 Modal 邏輯 ---
        const showModal = (title, message, options = {}) => {
            const modal = document.getElementById('custom-modal');
            const modalInner = modal.querySelector('div.bg-white');
            const btnCancel = document.getElementById('modal-cancel');
            const btnConfirm = document.getElementById('modal-confirm');

            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-message').innerText = message;

            btnCancel.style.display = options.isAlert ? 'none' : 'block';
            btnConfirm.innerText = options.confirmText || '確定';
            btnConfirm.className = `px-4 py-2 text-white rounded-xl transition-colors font-medium ${options.confirmColor || 'bg-blue-600 hover:bg-blue-500'}`;

            return new Promise((resolve) => {
                const closeModal = (result) => {
                    modal.classList.remove('opacity-100');
                    modalInner.classList.remove('scale-100');
                    setTimeout(() => {
                        modal.classList.replace('flex', 'hidden');
                        btnConfirm.removeEventListener('click', onConfirm);
                        btnCancel.removeEventListener('click', onCancel);
                        resolve(result);
                    }, 300);
                };

                const onConfirm = () => closeModal(true);
                const onCancel = () => closeModal(false);

                btnConfirm.addEventListener('click', onConfirm);
                btnCancel.addEventListener('click', onCancel);

                modal.classList.replace('hidden', 'flex');
                void modal.offsetWidth;
                modal.classList.add('opacity-100');
                modalInner.classList.add('scale-100');
            });
        };

        // --- 視覺狀態 (View State) 儲存邏輯 ---
        let viewStateTimeout;
        const saveViewState = () => {
            if (!mm || !currentRoot) return;
            const getFoldedPaths = (node, path = "0", folded = []) => {
                if (node.payload && node.payload.fold === 1) folded.push(path);
                if (node.children) {
                    node.children.forEach((c, i) => getFoldedPaths(c, `${path}-${i}`, folded));
                }
                return folded;
            };
            const state = {
                transform: window.d3.zoomTransform(svgEl),
                foldedPaths: getFoldedPaths(currentRoot),
                isFitted: isFitted
            };
            localStorage.setItem('vghtpe_markmap_viewstate', JSON.stringify(state));
        };

        const debounceSaveViewState = () => {
            clearTimeout(viewStateTimeout);
            viewStateTimeout = setTimeout(saveViewState, 500);
        };

        svgEl.addEventListener('click', debounceSaveViewState);

        // --- 面板拖曳調整大小 (Resizer) 邏輯 ---
        const mainContainer = document.getElementById('main-container');
        let isResizing = false;

        const startResize = (e) => {
            isResizing = true;
            document.body.style.userSelect = 'none';
            document.body.style.cursor = window.innerWidth >= 768 ? 'col-resize' : 'row-resize';

            document.addEventListener('mousemove', resizePanel);
            document.addEventListener('touchmove', resizePanel, { passive: false });
            document.addEventListener('mouseup', stopResize);
            document.addEventListener('touchend', stopResize);
        };

        const resizePanel = (e) => {
            if (!isResizing) return;
            if (e.type === 'touchmove') e.preventDefault();

            const isDesktop = window.innerWidth >= 768;
            const containerRect = mainContainer.getBoundingClientRect();
            const clientX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
            const clientY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;

            if (isDesktop) {
                let newWidth = ((clientX - containerRect.left) / containerRect.width) * 100;
                newWidth = Math.max(10, Math.min(newWidth, 90));
                editorPane.style.width = `${newWidth}%`;
                editorPane.style.height = '100%';
            } else {
                let newHeight = ((clientY - containerRect.top) / containerRect.height) * 100;
                newHeight = Math.max(10, Math.min(newHeight, 90));
                editorPane.style.height = `${newHeight}%`;
                editorPane.style.width = '100%';
            }
        };

        const stopResize = () => {
            isResizing = false;
            document.body.style.userSelect = '';
            document.body.style.cursor = '';

            document.removeEventListener('mousemove', resizePanel);
            document.removeEventListener('touchmove', resizePanel);
            document.removeEventListener('mouseup', stopResize);
            document.removeEventListener('touchend', stopResize);

            if (mm) {
                setTimeout(() => {
                    mm.fit();
                    debounceSaveViewState();
                }, 50);
            }
        };

        resizer.addEventListener('mousedown', startResize);
        resizer.addEventListener('touchstart', startResize, { passive: false });

        let lastIsDesktop = window.innerWidth >= 768;
        window.addEventListener('resize', () => {
            const currentIsDesktop = window.innerWidth >= 768;
            if (lastIsDesktop !== currentIsDesktop) {
                editorPane.style.width = '';
                editorPane.style.height = '';
                lastIsDesktop = currentIsDesktop;
            }
            if (mm) {
                setTimeout(() => {
                    mm.fit();
                    debounceSaveViewState();
                }, 200);
            }
        });

        const resetFitState = () => {
            if (isFitted) {
                isFitted = false;
                fitText.innerText = '適應螢幕';
            }
            debounceSaveViewState();
        };
        svgEl.addEventListener('mousedown', resetFitState);
        svgEl.addEventListener('wheel', resetFitState);
        svgEl.addEventListener('touchstart', resetFitState);

        // --- 匯出與下載功能區塊 ---
        const saveFile = async (blob, suggestedName, description, acceptTypes) => {
            const fallbackDownload = () => {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = suggestedName;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            };

            try {
                if ('showSaveFilePicker' in window) {
                    const handle = await window.showSaveFilePicker({
                        suggestedName,
                        types: [{ description, accept: acceptTypes }]
                    });
                    const writable = await handle.createWritable();
                    await writable.write(blob);
                    await writable.close();
                } else {
                    fallbackDownload();
                }
            } catch (err) {
                if (err.name === 'AbortError') return;
                console.warn('受限於 iframe 安全政策，退回傳統下載模式:', err.message);
                fallbackDownload();
            }
        };

        btnDownloadMd.addEventListener('click', async () => {
            const markdownContent = cmEditor.getValue();
            const blob = new Blob([markdownContent], { type: 'text/markdown;charset=utf-8' });
            await saveFile(blob, 'markmap-mindmap.md', 'Markdown 檔案', { 'text/markdown': ['.md', '.markdown'] });
        });

        btnDownload.addEventListener('click', async () => {
            const endTag = '<' + '/script>';
            const scriptRegex = new RegExp(endTag, 'gi');
            const uiColor = parseInt(selColor.value, 10);
            let finalMdForExport = cmEditor.getValue().replace(scriptRegex, '&lt;/script&gt;').replace(/\xA0/g, ' ');

            const getFoldedPaths = (node, path = "0", folded = []) => {
                if (node && node.payload && node.payload.fold === 1) folded.push(path);
                if (node && node.children) {
                    node.children.forEach((c, i) => getFoldedPaths(c, `${path}-${i}`, folded));
                }
                return folded;
            };
            const currentFoldedPaths = currentRoot ? getFoldedPaths(currentRoot) : [];
            const foldedPathsJson = JSON.stringify(currentFoldedPaths);
            const currentTransform = window.d3.zoomTransform(svgEl);
            const transformJson = JSON.stringify(currentTransform);

            // 拆解 HTML 結尾標籤字串，避免被 Live Server 等工具誤判而強制注入腳本導致語法壞掉
            const htmlLines = [
                '<' + '!DOCTYPE html>',
                '<' + 'html lang="zh-TW">',
                '<' + 'head>',
                '    <meta charset="UTF-8">',
                '    <meta name="viewport" content="width=device-width, initial-scale=1.0">',
                '    <title>Markmap 匯出心智圖</title>',
                '    <script src="https://cdn.tailwindcss.com">' + endTag,
                '    <script src="https://cdn.jsdelivr.net/npm/d3@7">' + endTag,
                '    <style>',
                '        body { margin: 0; padding: 0; width: 100vw; height: 100vh; font-family: sans-serif; overflow: hidden; background-color: #f8fafc; }',
                '        svg { width: 100%; height: 100%; }',
                '        .markmap-link { fill: none; }',
                '        .markmap-node circle { cursor: pointer; transition: r 0.2s ease; }',
                '        .markmap-node circle:hover { r: 6px; }',
                '        #controls { position: absolute; top: 1rem; right: 1rem; display: flex; flex-wrap: wrap; gap: 0.5rem; background: rgba(255,255,255,0.9); padding: 0.75rem; border-radius: 0.75rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); z-index: 10; align-items: center; border: 1px solid #e2e8f0; }',
                '        button, select { padding: 0.375rem 0.75rem; border: 1px solid #cbd5e1; border-radius: 0.5rem; background: white; cursor: pointer; font-size: 0.875rem; font-weight: 500; color: #334155; transition: all 0.2s; }',
                '        button:hover, select:hover { background: #f1f5f9; border-color: #94a3b8; }',
                '    </style>',
                '<' + '/head>',
                '<' + 'body>',
                '    <div id="controls">',
                '        <div style="display: flex; align-items: center; gap: 0.5rem;">',
                '            <label for="sel-expand" style="font-size: 0.875rem; font-weight: 600; color: #475569;">展開層級</label>',
                '            <select id="sel-expand">',
                '                <option value="-1" selected>目前視角</option>',
                '                <option value="999">全部展開</option>',
                '                <option value="1">第 1 層</option>',
                '                <option value="2">第 2 層</option>',
                '                <option value="3">第 3 層</option>',
                '                <option value="4">第 4 層</option>',
                '                <option value="5">第 5 層</option>',
                '            </select>',
                '        </div>',
                '        <div style="width: 1px; height: 1.5rem; background: #cbd5e1; margin: 0 0.25rem;"></div>',
                '        <button id="btn-zoom-in" title="放大">🔍 放大</button>',
                '        <button id="btn-zoom-out" title="縮小">🔍 縮小</button>',
                '        <button id="btn-fit" title="適應螢幕">⛶ 適應螢幕</button>',
                '    </div>',
                '    <svg id="mindmap"></svg>',
                '    <script type="text/template" id="md-content">',
                finalMdForExport,
                '    ' + endTag,
                '    <script type="module">',
                '        import * as markmapLib from "https://cdn.jsdelivr.net/npm/markmap-lib@0.18.9/+esm";',
                '        import * as markmapView from "https://cdn.jsdelivr.net/npm/markmap-view@0.18.9/+esm";',
                '        import * as markmapCommon from "https://cdn.jsdelivr.net/npm/markmap-common@0.18.9/+esm";',
                '',
                '        const { Transformer, Markmap, loadCSS, loadJS, deriveOptions } = { ...markmapLib, ...markmapView, ...markmapCommon };',
                '        const transformer = new Transformer();',
                '        const mdContent = document.getElementById("md-content").textContent;',
                '        ',
                '        (async () => {',
                '            const { root, features, frontmatter } = transformer.transform(mdContent);',
                '            const { styles, scripts } = transformer.getUsedAssets(features);',
                '            if (styles) loadCSS(styles);',
                '            if (scripts) await loadJS(scripts, { getMarkmap: () => ({ ...markmapLib, ...markmapView, ...markmapCommon }) });',
                '            ',
                '            const optionsRaw = frontmatter?.markmap || {};',
                '            let finalOptions = typeof deriveOptions === "function" ? deriveOptions(optionsRaw) : {};',
                '            const uiColor = ' + uiColor + ';',
                '            if (!finalOptions.color && (optionsRaw.colorFreezeLevel !== undefined || uiColor !== -1)) {',
                '                const freezeLevel = uiColor !== -1 ? uiColor : optionsRaw.colorFreezeLevel;',
                '                const colors = ["#00508C", "#00A0E9", "#00B2A9", "#F39200", "#E60012", "#71C5E8", "#C4D600", "#8A8D8F"];',
                '                finalOptions.color = (node) => colors[Math.min(node.depth, freezeLevel) % colors.length];',
                '            }',
                '            ',
                '            const foldedPaths = ' + foldedPathsJson + ';',
                '            const applyFoldedPaths = (node, paths, path = "0") => {',
                '                if (!node.payload) node.payload = {};',
                '                node.payload.fold = paths.includes(path) ? 1 : 0;',
                '                if (node.children) {',
                '                    node.children.forEach((c, i) => applyFoldedPaths(c, paths, `${path}-${i}`));',
                '                }',
                '            };',
                '            applyFoldedPaths(root, foldedPaths);',
                '            ',
                '            const svgEl = document.getElementById("mindmap");',
                '            const mm = Markmap.create(svgEl, finalOptions, root);',
                '            ',
                '            const transformData = ' + transformJson + ';',
                '            const d3Transform = d3.zoomIdentity.translate(transformData.x, transformData.y).scale(transformData.k);',
                '            d3.select(svgEl).call(mm.zoom.transform, d3Transform);',
                '            ',
                '            document.getElementById("btn-zoom-in").addEventListener("click", () => {',
                '                d3.select(svgEl).transition().duration(300).call(mm.zoom.scaleBy, 1.2);',
                '            });',
                '            document.getElementById("btn-zoom-out").addEventListener("click", () => {',
                '                d3.select(svgEl).transition().duration(300).call(mm.zoom.scaleBy, 0.8);',
                '            });',
                '            document.getElementById("btn-fit").addEventListener("click", () => {',
                '                mm.fit();',
                '            });',
                '            document.getElementById("sel-expand").addEventListener("change", (e) => {',
                '                const level = parseInt(e.target.value, 10);',
                '                const applyExpand = (node, currentDepth) => {',
                '                    if (!node.payload) node.payload = {};',
                '                    node.payload.fold = currentDepth >= level ? 1 : 0;',
                '                    if (node.children) {',
                '                        node.children.forEach(c => applyExpand(c, currentDepth + 1));',
                '                    }',
                '                };',
                '                applyExpand(root, 0);',
                '                mm.setData(root);',
                '                mm.fit();',
                '            });',
                '        })();',
                '    ' + endTag,
                '<' + '/body>',
                '<' + '/html>'
            ];
            const htmlContent = htmlLines.join('\n');
            const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
            await saveFile(blob, 'markmap-mindmap.html', 'HTML 網頁檔案', { 'text/html': ['.html'] });
        });

        btnDownloadSvg.addEventListener('click', async () => {
            if (!svgEl) return;
            const clone = svgEl.cloneNode(true);
            const style = document.createElement('style');
            style.textContent = `
                        .markmap-link { fill: none; }
                        .markmap-node circle { cursor: pointer; }
                        foreignObject { overflow: visible; }
                        svg { background-color: #ffffff; color: #1f2937; font-family: sans-serif; }
                        code { background-color: #f3f4f6; border-radius: 4px; padding: 2px 4px; }
                    `;
            clone.insertBefore(style, clone.firstChild);
            if (!clone.getAttribute('xmlns')) {
                clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
            }
            const svgData = new XMLSerializer().serializeToString(clone);
            const blob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
            await saveFile(blob, 'markmap-mindmap.svg', 'SVG 圖片檔案', { 'image/svg+xml': ['.svg'] });
        });

        // --- 核心更新函數 ---
        const updateMindmap = async (markdown, isInitialLoad = false) => {
            try {
                const safeMarkdown = markdown.replace(/\xA0/g, ' ');
                const { root, features, frontmatter } = transformer.transform(safeMarkdown);
                currentRoot = root;

                const { styles, scripts } = transformer.getUsedAssets(features);
                if (styles) loadCSS(styles);
                if (scripts) {
                    await loadJS(scripts, { getMarkmap: () => window.markmap });
                }

                const optionsRaw = frontmatter?.markmap || {};
                const uiExpand = parseInt(selExpand.value, 10);
                const uiColor = parseInt(selColor.value, 10);

                if (uiExpand !== -1) optionsRaw.initialExpandLevel = uiExpand;
                if (uiColor !== -1) optionsRaw.colorFreezeLevel = uiColor;

                const optionsStr = JSON.stringify(optionsRaw);
                const optionsChanged = currentOptionsStr !== optionsStr;

                let finalOptions = typeof deriveOptions === 'function' ? deriveOptions(optionsRaw) : {};

                let savedViewState = null;
                if (isInitialLoad) {
                    const stateStr = localStorage.getItem('vghtpe_markmap_viewstate');
                    if (stateStr) {
                        try {
                            savedViewState = JSON.parse(stateStr);
                        } catch (e) {
                            console.error('無法解析儲存的視角狀態', e);
                        }
                    }
                }

                if (isInitialLoad && savedViewState && savedViewState.foldedPaths) {
                    const applyFoldedPaths = (node, foldedPaths, path = "0") => {
                        if (!node.payload) node.payload = {};
                        node.payload.fold = foldedPaths.includes(path) ? 1 : 0;
                        if (node.children) {
                            node.children.forEach((c, i) => applyFoldedPaths(c, foldedPaths, `${path}-${i}`));
                        }
                    };
                    applyFoldedPaths(root, savedViewState.foldedPaths);
                } else if (optionsRaw.initialExpandLevel !== undefined && (optionsChanged || !mm)) {
                    const level = optionsRaw.initialExpandLevel;
                    const applyExpand = (node, currentDepth) => {
                        if (!node.payload) node.payload = {};
                        node.payload.fold = currentDepth >= level ? 1 : 0;
                        if (node.children) {
                            node.children.forEach((c, i) => applyExpand(c, currentDepth + 1));
                        }
                    };
                    applyExpand(root, 0);
                }

                if (!finalOptions.color && optionsRaw.colorFreezeLevel !== undefined) {
                    const freezeLevel = optionsRaw.colorFreezeLevel;
                    const colors = ['#00508C', '#00A0E9', '#00B2A9', '#F39200', '#E60012', '#71C5E8', '#C4D600', '#8A8D8F'];
                    finalOptions.color = (node) => colors[Math.min(node.depth, freezeLevel) % colors.length];
                }

                if (!mm) {
                    currentOptionsStr = optionsStr;
                    mm = Markmap.create(svgEl, finalOptions, root);

                    if (isInitialLoad && savedViewState && savedViewState.transform) {
                        const t = savedViewState.transform;
                        const d3Transform = window.d3.zoomIdentity.translate(t.x, t.y).scale(t.k);
                        setTimeout(() => {
                            window.d3.select(svgEl).call(mm.zoom.transform, d3Transform);
                        }, 50);

                        isFitted = savedViewState.isFitted || false;
                        fitText.innerText = isFitted ? '恢復視角' : '適應螢幕';
                        if (!isFitted) prevTransform = t;
                    } else {
                        mm.fit();
                        isFitted = true;
                        fitText.innerText = '恢復視角';
                    }
                } else if (optionsChanged) {
                    currentOptionsStr = optionsStr;
                    mm.destroy();
                    svgEl.innerHTML = '';
                    mm = Markmap.create(svgEl, finalOptions, root);
                    mm.fit();
                    isFitted = true;
                    fitText.innerText = '恢復視角';
                    prevTransform = null;
                } else {
                    mm.setData(root);
                }
            } catch (error) {
                console.error("渲染心智圖時發生錯誤:", error);
            }
        };

        let timeout;
        let saveTimeout;
        const debounceUpdate = (markdown, isInitialLoad = false) => {
            clearTimeout(timeout);
            timeout = setTimeout(() => {
                updateMindmap(markdown, isInitialLoad);

                if (!isInitialLoad) {
                    localStorage.setItem('vghtpe_markmap_content', markdown);
                    if (saveStatus) {
                        saveStatus.classList.remove('opacity-0');
                        clearTimeout(saveTimeout);
                        saveTimeout = setTimeout(() => {
                            saveStatus.classList.add('opacity-0');
                        }, 2000);
                    }
                }
            }, isInitialLoad ? 0 : 300);
        };

        cmEditor.on('change', () => {
            debounceUpdate(cmEditor.getValue());
        });

        if (btnClearEditor) {
            btnClearEditor.addEventListener('click', async () => {
                const confirmed = await showModal(
                    '清除內容',
                    '確定要清除編輯區的所有內容嗎？（清除後您可以重新輸入）',
                    { confirmText: '確定清除', confirmColor: 'bg-red-500 hover:bg-red-600' }
                );
                if (confirmed) {
                    cmEditor.setValue('');
                    debounceUpdate('');
                    cmEditor.focus();
                }
            });
        }

        if (btnImportFile && fileImport) {
            btnImportFile.addEventListener('click', () => {
                fileImport.click();
            });

            fileImport.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = async (event) => {
                    const content = event.target.result;
                    if (cmEditor.getValue().trim() !== '') {
                        const confirmed = await showModal(
                            '匯入檔案',
                            '匯入檔案將會覆蓋當前編輯區的所有內容，是否繼續？',
                            { confirmText: '確定覆蓋', confirmColor: 'bg-indigo-500 hover:bg-indigo-600' }
                        );
                        if (!confirmed) {
                            fileImport.value = '';
                            return;
                        }
                    }
                    cmEditor.setValue(content);
                    debounceUpdate(content);
                    fileImport.value = '';
                };
                reader.onerror = async (error) => {
                    console.error('檔案讀取失敗:', error);
                    await showModal('錯誤', '檔案讀取失敗，請重試！', { isAlert: true, confirmColor: 'bg-red-500 hover:bg-red-600' });
                };
                reader.readAsText(file);
            });
        }

        selExpand.addEventListener('change', () => debounceUpdate(cmEditor.getValue()));
        selColor.addEventListener('change', () => debounceUpdate(cmEditor.getValue()));

        btnFit.addEventListener('click', () => {
            if (!mm) return;
            if (isFitted && prevTransform) {
                window.d3.select(svgEl).transition().duration(300).call(mm.zoom.transform, prevTransform);
                isFitted = false;
                fitText.innerText = '適應螢幕';
            } else {
                prevTransform = window.d3.zoomTransform(svgEl);
                mm.fit();
                isFitted = true;
                fitText.innerText = '恢復視角';
            }
            debounceSaveViewState();
        });

        btnZoomIn.addEventListener('click', () => {
            if (!mm) return;
            window.d3.select(svgEl).transition().duration(300).call(mm.zoom.scaleBy, 1.2);
            if (isFitted) {
                isFitted = false;
                fitText.innerText = '適應螢幕';
            }
            debounceSaveViewState();
        });

        btnZoomOut.addEventListener('click', () => {
            if (!mm) return;
            window.d3.select(svgEl).transition().duration(300).call(mm.zoom.scaleBy, 0.8);
            if (isFitted) {
                isFitted = false;
                fitText.innerText = '適應螢幕';
            }
            debounceSaveViewState();
        });

        // --- 預設內容 ---
        const defaultContent = `# 歡迎使用心智圖編輯器
## 什麼是 Markmap？
- Markmap 是一個可以將 Markdown 語法轉換為心智圖的開源工具
- 它結合了 markdown 的易讀性與心智圖的視覺化優勢

## 核心特色
- **即時預覽**：左側編輯，右側立即顯示結果
- **呈現多種資料格式**
  - **支援數學公式**：如 $x = {-b \\pm \\sqrt{b^2-4ac} \\over 2a}$<!-- markmap: fold -->
    - [更多數學公式範例](#?d=gist:af76a4c245b302206b16aec503dbe07b:katex.md)
    - **strong** ~~del~~ *italic* ==highlight==
  - \`inline code\`
  - [x] checkbox
  -
    \`\`\`js
    console.log('hello, JavaScript')
    \`\`\`
  - 
    | Products | Price |
    |-|-|
    | Apple | 4 |
    | Banana | 2 |

  - ![圖片](https://markmap.js.org/favicon.png)

- **多種匯出格式**
  - Markdown 原始檔
  - SVG 向量圖
  - 可互動的 HTML 網頁

## 如何使用？
1. 在左側編輯區輸入您的想法
2. 使用縮進 (Tab) 來建立層級結構
3. 也可以直接點擊上方按鈕匯入現有的 Markdown 檔案
4. 快速縮放預覽：按下\`ctrl\` + 滑鼠滾輪`;

        // --- 啟動邏輯 ---
        async function initEditor() {
            const savedContent = localStorage.getItem('vghtpe_markmap_content');
            if (savedContent) {
                // 如果本地有暫存，優先使用暫存
                cmEditor.setValue(savedContent);
                debounceUpdate(savedContent, true);
            } else {
                // 原本是 fetch sample.md，這裡為了單一檔案預覽改用內建字串
                cmEditor.setValue(defaultContent);
                debounceUpdate(defaultContent, true);
            }
        }

        // 執行啟動
        initEditor();
    </script>
</body>
